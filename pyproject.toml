[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bhashadrive"
version = "0.2.0"
description = "Local multilingual (English/Hindi/Hinglish) in-car voice intent engine prototype"
requires-python = ">=3.10"

[project.scripts]
bhashadrive = "bhashadrive.cli:main"

[tool.setuptools.packages.find]
include = ["bhashadrive*"]

[tool.setuptools.package-data]
bhashadrive = ["evaluation/*.jsonl", "api/static/*"]

[tool.pytest.ini_options]
testpaths = ["bhashadrive/tests"]
markers = ["integration: requires the real local models (V2: sherpa-onnx + trained NLU artifacts; V1: Ollama + Whisper)"]
addopts = "-m 'not integration'"
